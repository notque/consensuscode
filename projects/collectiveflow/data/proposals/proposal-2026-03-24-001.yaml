id: proposal-2026-03-24-001
title: Address 22 Dependabot Security Vulnerabilities Collectively
description: "GitHub has identified 22 dependency vulnerabilities across our projects (6 high, 14 moderate, 2 low). Rather than having a single specialist fix these unilaterally, the collective should decide: which vulnerabilities to prioritize, whether to accept risk on low-severity items, how dependency updates might affect our projects, and what testing is required after updates. Security decisions affecting all codebases are collective decisions."
