[pytest]
# CollectiveFlow Web Application Test Configuration
#
# This configuration embodies our collective principles:
# - Clear, understandable test output for all members
# - Comprehensive coverage tracking for transparency
# - Accessible test organization and reporting

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output and reporting options
# -v: Verbose output for clarity
# --tb=short: Concise tracebacks that are easier to read
# --strict-markers: Ensure all test markers are registered
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=json
    --cov-branch

# Custom markers for organizing tests
markers =
    routes: Tests for Flask route handlers
    templates: Tests for template rendering
    filters: Tests for Jinja2 custom filters
    data: Tests for YAML data loading and persistence
    api: Tests for API endpoints
    integration: Integration tests that test multiple components together
    slow: Tests that take more time to run

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
# Coverage thresholds reflecting our commitment to quality
# These are reasonable targets, not hierarchical mandates
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov
